# Production stack: app + Caddy (automatic HTTPS, on-demand TLS for customer domains).
# 1. cp .env.example .env and fill it in (APP_URL=https://$APP_DOMAIN)
# 2. DNS: A record APP_DOMAIN and *.PUBLISH_ROOT_DOMAIN -> this server; CNAME_TARGET -> this server
# 3. docker compose up -d --build   (full guide: docs/DEPLOYMENT.md, tools: deploy/*.sh)
services:
  app:
    # Build from source (default), or run a released image without building:
    #   APP_IMAGE=ghcr.io/hitechcloud-vietnam/hitechcloudlandingpage:v1.0.0 in .env, then
    #   docker compose pull app && docker compose up -d --no-build
    image: ${APP_IMAGE:-hitechcloud-landingpage:local}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_FILE: /data/hitechcloud.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-admin@hitechcloud.vn}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:

# Monitoring (optional). /metrics needs METRICS_TOKEN in .env and is only served on
# APP_DOMAIN. Example Prometheus scrape job (prometheus.yml):
#
#   scrape_configs:
#     - job_name: hitechcloud
#       scheme: https
#       metrics_path: /metrics
#       authorization:
#         type: Bearer
#         credentials: <METRICS_TOKEN>
#       static_configs:
#         - targets: ["app.hitechcloud.vn"]   # APP_DOMAIN
#
# Readiness probe (DB accepts writes): GET /readyz. Logs are JSON lines on stdout:
#   docker compose logs -f app | jq 'select(.level == "error")'
