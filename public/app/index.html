<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điều khiển · HiTechCloud LandingPage</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="topbar">
  <div class="container">
    <a class="brand" href="/app/">HiTech<span>Cloud</span></a>
    <div class="topbar-right">
      <select id="ws-select" aria-label="Chọn workspace"></select>
      <a class="btn btn-ghost btn-sm" id="admin-link" href="/app/admin" hidden>Quản trị</a>
      <span class="user-name muted" id="user-name"></span>
      <button class="btn btn-ghost btn-sm" id="logout">Đăng xuất</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="page-head row">
    <div>
      <h1 id="ws-name">…</h1>
      <span class="badge badge-primary" id="ws-plan"></span>
    </div>
    <button class="btn" id="new-site-btn">+ Tạo website</button>
  </div>

  <div class="usage" id="usage" style="margin-top:16px"></div>

  <div class="tabs" role="tablist">
    <button class="active" data-tab="sites">Website</button>
    <button data-tab="members">Thành viên</button>
    <button data-tab="billing">Gói dịch vụ</button>
    <button data-tab="settings">Cài đặt</button>
  </div>

  <div class="alert" id="error"></div>

  <section data-panel="sites"><div class="grid" id="sites"></div></section>

  <section data-panel="members" hidden>
    <div class="card stack">
      <form id="member-form" class="row" style="align-items:flex-end">
        <div style="flex:1 1 240px"><label for="member-email">Thêm thành viên theo email</label><input id="member-email" name="email" type="email" required></div>
        <div style="flex:0 1 160px"><label for="member-role">Vai trò</label>
          <select id="member-role" name="role"><option value="editor">Biên tập viên</option><option value="admin">Quản trị viên</option></select></div>
        <button class="btn" type="submit">Thêm</button>
      </form>
      <div class="table-wrap"><table><thead><tr><th>Tên</th><th>Email</th><th>Vai trò</th><th></th></tr></thead><tbody id="members"></tbody></table></div>
      <div id="invites-wrap" hidden>
        <h3 style="margin:8px 0">Lời mời đang chờ</h3>
        <div class="table-wrap"><table><thead><tr><th>Email</th><th>Vai trò</th><th>Hết hạn</th><th></th></tr></thead><tbody id="invites"></tbody></table></div>
      </div>
    </div>
  </section>

  <section data-panel="billing" hidden>
    <div class="stack">
      <div class="alert alert-info" id="order-notice"></div>
      <div class="card row">
        <div><span class="muted">Gói hiện tại</span><strong style="display:block;font-size:20px" id="current-plan"></strong><span class="muted" id="plan-expiry"></span></div>
        <div class="row" id="pay-options">
          <label class="inline">Chu kỳ
            <select id="cycle"><option value="1">1 tháng</option><option value="12">12 tháng (tặng 2 tháng)</option></select></label>
          <label class="inline">Thanh toán qua
            <select id="provider"></select></label>
        </div>
      </div>
      <div class="grid" id="plans"></div>
      <div class="card">
        <h3 style="margin-top:0">Lịch sử thanh toán</h3>
        <div class="table-wrap"><table><thead><tr><th>Mã</th><th>Gói</th><th>Số tiền</th><th>Cổng</th><th>Trạng thái</th><th>Thời gian</th></tr></thead><tbody id="orders"></tbody></table></div>
      </div>
    </div>
  </section>

  <section data-panel="settings" hidden>
    <div class="card stack">
      <form id="ws-form">
        <label for="ws-rename">Tên workspace</label>
        <div class="row"><input id="ws-rename" name="name" style="flex:1" required><button class="btn" type="submit">Lưu</button></div>
      </form>
      <form id="profile-form">
        <label for="profile-name">Họ tên của bạn</label>
        <div class="row"><input id="profile-name" name="name" style="flex:1" required><button class="btn btn-ghost" type="submit">Lưu</button></div>
      </form>
      <form id="password-form">
        <label>Đổi mật khẩu</label>
        <div class="row">
          <input name="currentPassword" type="password" placeholder="Mật khẩu hiện tại" autocomplete="current-password" style="flex:1 1 200px" required>
          <input name="newPassword" type="password" placeholder="Mật khẩu mới (≥ 8 ký tự)" minlength="8" autocomplete="new-password" style="flex:1 1 200px" required>
          <button class="btn btn-ghost" type="submit">Đổi mật khẩu</button>
        </div>
      </form>
      <form id="ws-new-form">
        <label for="ws-new">Tạo workspace mới (cho khách hàng/dự án khác)</label>
        <div class="row"><input id="ws-new" name="name" style="flex:1" required><button class="btn btn-ghost" type="submit">Tạo</button></div>
      </form>
    </div>
  </section>
</main>

<dialog id="site-dialog">
  <form id="site-form" method="dialog">
    <h2>Tạo website mới</h2>
    <div class="alert" id="site-error"></div>
    <label for="site-name">Tên website</label>
    <input id="site-name" name="name" required>
    <label for="site-sub">Tên miền phụ</label>
    <input id="site-sub" name="subdomain" pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?" required>
    <div class="hint">Trang sẽ có địa chỉ <code>/p/<span id="sub-preview">ten-mien</span></code></div>
    <label>Mẫu khởi đầu</label>
    <div class="template-list" id="templates"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" value="cancel" id="site-cancel">Hủy</button>
      <button class="btn" type="submit">Tạo website</button>
    </div>
  </form>
</dialog>

<script src="/assets/api.js"></script>
<script>
const { api, esc, $, formData, slugify, formatVnd, limit } = HTC;
const ROLE_LABEL = { owner: 'Chủ sở hữu', admin: 'Quản trị viên', editor: 'Biên tập viên' };
const ORDER_STATUS = { pending: ['Chờ thanh toán', ''], paid: ['Đã thanh toán', 'badge-success'], cancelled: ['Đã hủy', ''], failed: ['Lỗi', 'badge-danger'] };
let me, ws, plans = [], providers = [];
const params = new URLSearchParams(location.search);

function selectTab(name) {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== name; });
}

function showError(err) { $('#error').textContent = err ? err.message : ''; }

async function load() {
  me = await api('/auth/me');
  $('#user-name').textContent = me.user.name;
  $('#admin-link').hidden = !me.user.isSuperAdmin;
  $('#profile-name').value = me.user.name;
  const current = HTC.currentWorkspace(me.workspaces);
  $('#ws-select').innerHTML = me.workspaces
    .map((w) => `<option value="${w.id}" ${w.id === current.id ? 'selected' : ''}>${esc(w.name)}</option>`)
    .join('');
  await loadWorkspace(current.id);
}

async function loadWorkspace(id) {
  HTC.setWorkspace(id);
  ws = await api(`/workspaces/${id}`);
  const p = ws.planDetails;
  $('#ws-name').textContent = ws.name;
  $('#ws-rename').value = ws.name;
  $('#ws-plan').textContent = `Gói ${p.name}`;
  $('#usage').innerHTML = [
    ['Website', ws.usage.sites, p.maxSites],
    ['Thành viên', ws.usage.members, p.maxMembers],
    ['Lead tháng này', ws.usage.leadsThisMonth, p.maxLeadsPerMonth],
  ].map(([label, used, max]) => `<div class="card"><span class="muted">${label}</span><strong>${used} / ${limit(max)}</strong></div>`).join('');
  await Promise.all([loadSites(), loadMembers(), loadPlans(), loadOrders()]);
}

async function loadSites() {
  const sites = await api(`/workspaces/${ws.id}/sites`);
  $('#sites').innerHTML = sites.length
    ? sites.map((s) => `
      <div class="card stack">
        <div><h3 style="margin:0">${esc(s.name)}</h3>
        <a class="muted" href="${esc(HTC.publicUrl(s))}" target="_blank" rel="noopener">/p/${esc(s.subdomain)}</a>
        ${s.custom_domain ? `<div class="muted">${esc(s.custom_domain)}</div>` : ''}</div>
        <div class="muted">${s.page_count} trang</div>
        <div class="row"><a class="btn btn-sm" href="/app/site?id=${s.id}">Quản lý</a></div>
      </div>`).join('')
    : '<div class="card muted">Chưa có website nào. Bấm “Tạo website” để bắt đầu.</div>';
}

async function loadMembers() {
  const [members, invites] = await Promise.all([api(`/workspaces/${ws.id}/members`), api(`/workspaces/${ws.id}/invitations`)]);
  const canManage = ws.role === 'owner' || ws.role === 'admin';
  $('#member-form').hidden = !canManage;
  $('#members').innerHTML = members.map((m) => `
    <tr><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td>${ROLE_LABEL[m.role]}</td>
    <td>${canManage && m.role !== 'owner' ? `<button class="btn btn-ghost btn-sm" data-remove="${m.id}">Xóa</button>` : ''}</td></tr>`).join('');
  $('#invites-wrap').hidden = !invites.length;
  $('#invites').innerHTML = invites.map((i) => `
    <tr><td>${esc(i.email)}</td><td>${ROLE_LABEL[i.role]}</td><td>${new Date(i.expires_at).toLocaleDateString('vi-VN')}</td>
    <td>${canManage ? `<button class="btn btn-ghost btn-sm" data-revoke="${i.id}">Thu hồi</button>` : ''}</td></tr>`).join('');
}

async function loadPlans() {
  [plans, providers] = await Promise.all([api('/plans'), api('/billing/providers')]);
  const canPay = ws.role === 'owner' || ws.role === 'admin';
  $('#current-plan').textContent = ws.planDetails.name;
  $('#plan-expiry').textContent = ws.effectivePlan !== 'free' && ws.plan_expires_at
    ? `Hết hạn: ${new Date(ws.plan_expires_at).toLocaleDateString('vi-VN')}`
    : ws.plan !== ws.effectivePlan ? 'Gói trả phí đã hết hạn' : '';
  $('#provider').innerHTML = providers.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('#pay-options').hidden = !providers.length || !canPay;
  renderPlans();
}

function renderPlans() {
  const months = Number($('#cycle').value);
  const canPay = (ws.role === 'owner' || ws.role === 'admin') && providers.length;
  $('#plans').innerHTML = plans.map((p) => {
    const current = p.id === ws.effectivePlan;
    const total = p.priceVnd * (months === 12 ? 10 : 1);
    let action = '';
    if (p.priceVnd > 0) {
      action = canPay
        ? `<button class="btn btn-sm" data-buy="${p.id}">${current ? 'Gia hạn' : 'Nâng cấp'} · ${total.toLocaleString('vi-VN')}đ</button>`
        : '<a class="btn btn-ghost btn-sm" href="mailto:sales@hitechcloud.vn">Liên hệ nâng cấp</a>';
    }
    if (me.user.isSuperAdmin && !current) action += ` <button class="btn btn-ghost btn-sm" data-plan="${p.id}">Cấp gói (admin)</button>`;
    return `
    <div class="card stack" ${current ? 'style="border:2px solid var(--primary)"' : ''}>
      <div class="row"><h3 style="margin:0">${esc(p.name)}</h3>${current ? '<span class="badge badge-success">Đang dùng</span>' : ''}</div>
      <strong style="font-size:22px">${formatVnd(p.priceVnd)}</strong>
      <ul class="muted" style="padding-left:18px;margin:0">
        <li>${limit(p.maxSites)} website</li>
        <li>${limit(p.maxPagesPerSite)} trang / website</li>
        <li>${limit(p.maxMembers)} thành viên</li>
        <li>${limit(p.maxLeadsPerMonth)} lead / tháng</li>
        <li>${p.customDomain ? 'Tên miền riêng' : 'Chỉ tên miền phụ'}</li>
        <li>${p.removeBranding ? 'Không gắn thương hiệu HiTechCloud' : 'Có gắn nhãn HiTechCloud'}</li>
      </ul>
      <div class="row" style="justify-content:flex-start">${action}</div>
    </div>`;
  }).join('');
}

async function loadOrders() {
  const orders = await api(`/workspaces/${ws.id}/orders`);
  const planName = (id) => (plans.find((p) => p.id === id) || { name: id }).name;
  $('#orders').innerHTML = orders.length
    ? orders.map((o) => {
      const [label, cls] = ORDER_STATUS[o.status];
      return `<tr><td>#${o.id}</td><td>${esc(planName(o.plan))} · ${o.months} tháng</td><td>${o.amount.toLocaleString('vi-VN')}đ</td>
        <td>${esc(o.provider)}</td><td><span class="badge ${cls}">${label}</span>
        ${o.checkout_url ? ` <a href="${esc(o.checkout_url)}">Tiếp tục thanh toán</a>` : ''}</td>
        <td>${esc(o.paid_at || o.created_at)}</td></tr>`;
    }).join('')
    : '<tr><td colspan="6" class="muted">Chưa có giao dịch.</td></tr>';

  const orderId = Number(params.get('order'));
  const o = orders.find((x) => x.id === orderId);
  $('#order-notice').textContent = !o ? '' : o.status === 'paid'
    ? `Thanh toán đơn #${o.id} thành công. Gói ${planName(o.plan)} đã được kích hoạt.`
    : o.status === 'pending'
      ? `Đơn #${o.id} đang chờ xác nhận thanh toán. Trang sẽ tự cập nhật khi cổng thanh toán báo về.`
      : `Đơn #${o.id}: ${ORDER_STATUS[o.status][0]}.`;
  if (o && o.status === 'pending' && !loadOrders.polling) {
    loadOrders.polling = setTimeout(() => { loadOrders.polling = null; loadWorkspace(ws.id).catch(showError); }, 5000);
  }
}

// ----- events -----
$('#logout').onclick = HTC.logout;
$('#ws-select').onchange = (e) => loadWorkspace(Number(e.target.value)).catch(showError);

document.querySelectorAll('.tabs button').forEach((btn) => { btn.onclick = () => selectTab(btn.dataset.tab); });
if (params.get('tab')) selectTab(params.get('tab'));
$('#cycle').onchange = renderPlans;

$('#member-form').onsubmit = async (e) => {
  e.preventDefault();
  showError();
  try {
    const res = await api(`/workspaces/${ws.id}/members`, { method: 'POST', body: formData(e.target) });
    if (res.status === 'invited') alert('Đã gửi email mời. Người được mời cần nhận lời mời để tham gia.');
    e.target.reset();
    await loadWorkspace(ws.id);
  } catch (err) { showError(err); }
};

$('#members').onclick = async (e) => {
  const id = e.target.dataset.remove;
  if (!id || !confirm('Xóa thành viên này khỏi workspace?')) return;
  try { await api(`/workspaces/${ws.id}/members/${id}`, { method: 'DELETE' }); await loadWorkspace(ws.id); } catch (err) { showError(err); }
};

$('#plans').onclick = async (e) => {
  const { plan, buy } = e.target.dataset;
  showError();
  try {
    if (buy) {
      e.target.disabled = true;
      const res = await api(`/workspaces/${ws.id}/checkout`, {
        method: 'POST',
        body: { plan: buy, months: Number($('#cycle').value), provider: $('#provider').value },
      });
      location.href = res.checkoutUrl;
    } else if (plan) {
      const months = plan === 'free' ? '' : prompt('Số tháng (để trống = không giới hạn)', '1');
      if (months === null) return;
      await api(`/workspaces/${ws.id}/plan`, { method: 'POST', body: { plan, months } });
      await loadWorkspace(ws.id);
    }
  } catch (err) { showError(err); e.target.disabled = false; }
};

$('#invites').onclick = async (e) => {
  const id = e.target.dataset.revoke;
  if (!id) return;
  try { await api(`/workspaces/${ws.id}/invitations/${id}`, { method: 'DELETE' }); await loadMembers(); } catch (err) { showError(err); }
};

$('#profile-form').onsubmit = async (e) => {
  e.preventDefault();
  try { await api('/auth/me', { method: 'PATCH', body: formData(e.target) }); await load(); } catch (err) { showError(err); }
};

$('#password-form').onsubmit = async (e) => {
  e.preventDefault();
  showError();
  try { await api('/auth/change-password', { method: 'POST', body: formData(e.target) }); e.target.reset(); alert('Đã đổi mật khẩu'); } catch (err) { showError(err); }
};

$('#ws-form').onsubmit = async (e) => {
  e.preventDefault();
  try { await api(`/workspaces/${ws.id}`, { method: 'PATCH', body: formData(e.target) }); await load(); } catch (err) { showError(err); }
};

$('#ws-new-form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const created = await api('/workspaces', { method: 'POST', body: formData(e.target) });
    HTC.setWorkspace(created.id);
    e.target.reset();
    await load();
  } catch (err) { showError(err); }
};

// ----- create site dialog -----
const dialog = $('#site-dialog');
let subTouched = false;
$('#new-site-btn').onclick = async () => {
  const templates = await api('/templates');
  $('#templates').innerHTML = templates.map((t, i) => `
    <label title="${esc(t.description)}"><input type="radio" name="template" value="${t.id}" ${t.id === 'saas' || (i === 0 && !templates.some((x) => x.id === 'saas')) ? 'checked' : ''}>${esc(t.name)}</label>`).join('');
  $('#site-form').reset();
  $('#site-error').textContent = '';
  subTouched = false;
  dialog.showModal();
};
$('#site-cancel').onclick = () => dialog.close();
$('#site-name').oninput = (e) => { if (!subTouched) { $('#site-sub').value = slugify(e.target.value); $('#sub-preview').textContent = $('#site-sub').value || 'ten-mien'; } };
$('#site-sub').oninput = (e) => { subTouched = true; $('#sub-preview').textContent = e.target.value || 'ten-mien'; };
$('#site-form').onsubmit = async (e) => {
  e.preventDefault();
  try {
    const site = await api(`/workspaces/${ws.id}/sites`, { method: 'POST', body: formData(e.target) });
    location.href = `/app/site?id=${site.id}`;
  } catch (err) { $('#site-error').textContent = err.message; }
};

load().catch(showError);
</script>
</body>
</html>
