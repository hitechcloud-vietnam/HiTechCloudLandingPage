<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · HiTechCloud LandingPage</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <a class="brand" href="/">HiTech<span>Cloud</span></a>
    <h1>Đăng nhập</h1>
    <p class="muted">Quản lý landing page của bạn.</p>
    <div class="alert" id="error"></div>
    <form id="form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="password">Mật khẩu</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn" style="width:100%;margin-top:20px" type="submit">Đăng nhập</button>
    </form>
    <p class="muted"><a href="/app/forgot">Quên mật khẩu?</a></p>
    <p class="muted">Chưa có tài khoản? <a href="/app/signup">Đăng ký miễn phí</a></p>
  </div>
</div>
<script src="/assets/api.js"></script>
<script>
  HTC.$('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    HTC.$('#error').textContent = '';
    try {
      await HTC.api('/auth/login', { method: 'POST', body: HTC.formData(e.target) });
      const next = new URLSearchParams(location.search).get('next') || '';
      location.href = next.startsWith('/app/') ? next : '/app/';
    } catch (err) {
      HTC.$('#error').textContent = err.message;
    }
  });
</script>
</body>
</html>
