<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trình thiết kế · HiTechCloud LandingPage</title>
<link rel="stylesheet" href="/vendor/grapes.min.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  .editor-bar { height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; background: #0f172a; color: #e2e8f0; }
  .editor-bar .left, .editor-bar .right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .editor-bar a.back { color: #cbd5e1; text-decoration: none; white-space: nowrap; }
  .editor-bar .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editor-bar .status { color: #94a3b8; font-size: 13px; white-space: nowrap; }
  .editor-bar .btn-ghost { color: #e2e8f0; border-color: #334155; }
  .editor-bar .btn-ghost:hover { background: #1e293b; }
  #gjs { height: calc(100% - 52px); }
  .gjs-one-bg { background-color: #1e293b; }
  .gjs-four-color, .gjs-four-color-h:hover { color: #60a5fa; }
  @media (max-width: 640px) { .editor-bar .status, .editor-bar .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="editor-bar">
  <div class="left">
    <a class="back" id="back" href="/app/">←</a>
    <span class="title" id="title">Đang tải…</span>
    <span class="status" id="status"></span>
  </div>
  <div class="right">
    <button class="btn btn-ghost btn-sm hide-sm" id="history-btn">Lịch sử</button>
    <button class="btn btn-ghost btn-sm hide-sm" id="seo-btn">SEO</button>
    <a class="btn btn-ghost btn-sm" id="preview" target="_blank" rel="noopener">Xem trước</a>
    <button class="btn btn-sm" id="publish">Xuất bản</button>
  </div>
</div>
<div id="gjs"></div>

<dialog id="seo-dialog">
  <form id="seo-form" method="dialog">
    <h2>Cài đặt SEO</h2>
    <div class="alert" id="seo-error"></div>
    <label for="seo-title">Tiêu đề trang (title)</label>
    <input id="seo-title" name="title" maxlength="200" required>
    <label for="seo-desc">Mô tả (meta description)</label>
    <textarea id="seo-desc" name="metaDescription" rows="3" maxlength="300"></textarea>
    <label for="seo-og">Ảnh chia sẻ Facebook/Zalo (og:image)</label>
    <input id="seo-og" name="ogImage" maxlength="500" placeholder="https://… (khuyên dùng 1200×630)">
    <div class="dialog-actions">
      <button class="btn btn-ghost" type="button" id="seo-cancel">Hủy</button>
      <button class="btn" type="submit">Lưu</button>
    </div>
  </form>
</dialog>

<dialog id="history-dialog">
  <form method="dialog">
    <h2>Lịch sử xuất bản</h2>
    <p class="muted">Mỗi lần xuất bản sẽ lưu một phiên bản (giữ 20 bản gần nhất). Khôi phục sẽ thay bản nháp hiện tại, trang đang chạy không đổi cho tới khi bạn xuất bản lại.</p>
    <div class="table-wrap"><table><tbody id="versions"></tbody></table></div>
    <div class="dialog-actions"><button class="btn btn-ghost" value="close">Đóng</button></div>
  </form>
</dialog>

<script src="/vendor/grapes.min.js"></script>
<script src="/vendor/blocks-basic.js"></script>
<script src="/vendor/plugin-forms.js"></script>
<script src="/assets/api.js"></script>
<script>
(async () => {
  const { api, $ } = HTC;
  const pageId = Number(new URLSearchParams(location.search).get('page'));
  const setStatus = (text) => { $('#status').textContent = text; };
  const plugin = (name) => { const m = window[name]; return m && m.default ? m.default : m; };

  let page, blocks;
  try {
    [page, blocks] = await Promise.all([api(`/pages/${pageId}`), api('/blocks')]);
  } catch (err) {
    $('#title').textContent = err.message;
    return;
  }

  document.title = `${page.title} · Trình thiết kế`;
  $('#title').textContent = `${page.site.name} / ${page.title}`;
  $('#back').href = `/app/site?id=${page.site.id}`;
  $('#preview').href = `/preview/${page.id}`;

  const assetsUrl = `/api/workspaces/${page.site.workspace_id}/assets`;
  let assetList = [];
  try { assetList = (await api(assetsUrl.replace('/api', ''))).assets; } catch {}

  // Uploads each file as a raw image body (see src/routes/content.js).
  async function uploadFiles(e) {
    const files = [...((e.dataTransfer && e.dataTransfer.files) || (e.target && e.target.files) || [])];
    for (const file of files) {
      setStatus(`Đang tải ${file.name}…`);
      try {
        const res = await fetch(assetsUrl, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': file.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(file.name) },
          body: file,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || `Lỗi ${res.status}`);
        editor.AssetManager.add({ src: data.src, name: data.name, type: 'image' });
        setStatus('Đã tải ảnh lên');
      } catch (err) {
        setStatus('');
        alert(`${file.name}: ${err.message}`);
      }
    }
  }

  // Conversion widgets: component types matched by their data attributes, with
  // traits (Settings panel) for the options read by the runtimes in render.js.
  // Registered as a plugin so the types exist before the project loads.
  const widgetsPlugin = (editor) => {
    const opts = (pairs) => pairs.map(([id, name]) => ({ id, name }));
    const widgetType = (type, attr, name, traits) => editor.DomComponents.addType(type, {
      isComponent: (el) => el.nodeType === 1 && el.hasAttribute(attr),
      model: { defaults: { name, traits } },
    });
    widgetType('htc-popup', 'data-htc-popup', 'Popup', [
      { type: 'select', name: 'data-htc-popup', label: 'Hiện khi', options: opts([['delay', 'Sau thời gian chờ'], ['exit', 'Khách định rời trang'], ['scroll', 'Cuộn tới % trang']]) },
      { type: 'number', name: 'data-htc-delay', label: 'Thời gian chờ (giây)', min: 0, max: 600, placeholder: '8' },
      { type: 'number', name: 'data-htc-scroll', label: 'Cuộn tới (%)', min: 0, max: 100, placeholder: '50' },
      { type: 'select', name: 'data-htc-frequency', label: 'Tần suất', options: opts([['session', 'Một lần mỗi phiên'], ['once-per-day', 'Một lần mỗi ngày'], ['always', 'Mỗi lần tải trang']]) },
    ]);
    widgetType('htc-sticky', 'data-htc-sticky', 'Thanh thông báo cố định', [
      { type: 'select', name: 'data-htc-sticky', label: 'Vị trí', options: opts([['bottom', 'Cuối màn hình'], ['top', 'Đầu màn hình']]) },
    ]);
    widgetType('htc-proof', 'data-htc-proof', 'Thông báo khách vừa đăng ký', [
      { type: 'select', name: 'data-htc-proof', label: 'Vị trí', options: opts([['left', 'Góc dưới trái'], ['right', 'Góc dưới phải']]) },
      { type: 'text', name: 'data-htc-items', label: 'Nội dung (ngăn cách bằng |)' },
      { type: 'number', name: 'data-htc-interval', label: 'Giãn cách (giây)', min: 3, max: 120, placeholder: '8' },
    ]);
  };

  const editor = grapesjs.init({
    container: '#gjs',
    height: '100%',
    fromElement: false,
    showOffsets: true,
    cssIcons: '/vendor/font-awesome/css/font-awesome.min.css',
    canvas: { styles: [] },
    // Editor-only: show conversion widgets in the page flow so they can be edited
    // (on the published page they are fixed/hidden until triggered).
    canvasCss: `
      .htc-popup{display:flex!important;position:relative!important;inset:auto!important;z-index:auto!important;padding:44px 16px 32px!important}
      .htc-sticky,.htc-proof{position:relative!important;inset:auto!important;z-index:auto!important}
      .htc-sticky.htc-hidden{display:block!important}
      .htc-proof{opacity:1!important;visibility:visible!important;transform:none!important;margin:16px!important;max-width:340px}
      .htc-popup,.htc-sticky,.htc-proof{outline:2px dashed #f59e0b;outline-offset:-2px}
      .htc-popup:before,.htc-sticky:before,.htc-proof:before{position:absolute;top:-1px;left:-1px;z-index:1;padding:2px 8px;border-radius:0 0 6px 0;background:#f59e0b;color:#fff;font:600 11px/1.6 system-ui,sans-serif;pointer-events:none}
      .htc-popup:before{content:'Popup · hiện theo kích hoạt — chọn khung này rồi mở tab Cài đặt (⚙)'}
      .htc-sticky:before{content:'Thanh thông báo cố định'}
      .htc-proof:before{content:'Thông báo xoay vòng'}
    `,
    assetManager: {
      assets: assetList.map((a) => ({ src: a.src, name: a.name, type: 'image' })),
      uploadFile: uploadFiles,
      uploadText: 'Kéo thả ảnh vào đây hoặc bấm để chọn (PNG, JPG, GIF, WEBP ≤ 5MB)',
      addBtnText: 'Thêm ảnh từ URL',
    },
    deviceManager: {
      devices: [
        { id: 'desktop', name: 'Máy tính', width: '' },
        { id: 'tablet', name: 'Máy tính bảng', width: '768px', widthMedia: '992px' },
        { id: 'mobile', name: 'Điện thoại', width: '375px', widthMedia: '480px' },
      ],
    },
    plugins: [plugin('gjs-blocks-basic'), plugin('grapesjs-plugin-forms'), widgetsPlugin].filter(Boolean),
    pluginsOpts: {},
    storageManager: {
      type: 'remote',
      autosave: true,
      stepsBeforeSave: 3,
      options: {
        remote: {
          urlLoad: `/api/pages/${pageId}/project`,
          urlStore: `/api/pages/${pageId}/project`,
          credentials: 'same-origin',
          fetchOptions: (opts) => (opts.method === 'POST' ? { method: 'PUT' } : {}),
          onStore: (project, ed) => ({ project, html: ed.getHtml(), css: ed.getCss() }),
          // A page created from a template has HTML/CSS but no GrapesJS project yet.
          onLoad: (res) => res.project || { pages: [{ component: res.html || '' }], styles: res.css || '' },
        },
      },
    },
  });

  // Landing page section blocks served by the platform.
  const WIDGET_ICON = '<svg viewBox="0 0 24 24" width="40" height="40"><rect x="2" y="3" width="20" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="6" y="8" width="12" height="8" rx="1.5" fill="currentColor" opacity=".35"/></svg>';
  const blockCss = {};
  for (const b of blocks.blocks) {
    if (b.css) blockCss[`htc-${b.id}`] = b.css;
    editor.BlockManager.add(`htc-${b.id}`, {
      label: b.label,
      category: b.css ? 'HiTechCloud – Chuyển đổi' : 'HiTechCloud – Section',
      content: b.html,
      media: b.css ? WIDGET_ICON : '<svg viewBox="0 0 24 24" width="40" height="40"><rect x="2" y="5" width="20" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 9h14M5 13h9" stroke="currentColor" stroke-width="1.5"/></svg>',
    });
  }

  // Make sure the shared section styles exist when sections are dropped onto a blank page,
  // and widget styles exist on pages created before the widgets were added.
  editor.on('block:drag:stop', (_component, block) => {
    const id = block ? String(block.getId()) : '';
    if (!id.startsWith('htc-')) return;
    if (!editor.getCss().includes('.htc-container')) editor.addStyle(blocks.css);
    if (blockCss[id] && !editor.getCss().includes('.htc-popup-box')) editor.addStyle(blockCss[id]);
  });

  editor.on('storage:start:store', () => setStatus('Đang lưu…'));
  editor.on('storage:end:store', () => setStatus('Đã lưu'));
  editor.on('storage:error', (err) => setStatus(`Lỗi lưu: ${err && err.message ? err.message : err}`));
  editor.on('update', () => setStatus('Có thay đổi chưa lưu'));

  window.addEventListener('beforeunload', (e) => {
    if (editor.getDirtyCount() > 0) { e.preventDefault(); e.returnValue = ''; }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); editor.store(); }
  });

  $('#preview').addEventListener('click', async (e) => {
    e.preventDefault();
    const win = window.open('about:blank', '_blank');
    await editor.store();
    if (win) win.location = `/preview/${page.id}`;
  });

  $('#publish').addEventListener('click', async () => {
    const btn = $('#publish');
    btn.disabled = true;
    try {
      await editor.store();
      await api(`/pages/${page.id}/publish`, { method: 'POST', body: {} });
      setStatus('Đã xuất bản');
      const url = HTC.publicUrl(page.site, page.slug);
      if (confirm(`Đã xuất bản thành công!\n${url}\n\nMở trang?`)) window.open(url, '_blank', 'noopener');
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
    }
  });

  const history = $('#history-dialog');
  async function loadVersions() {
    const versions = await api(`/pages/${page.id}/versions`);
    $('#versions').innerHTML = versions.length
      ? versions.map((v, i) => `<tr><td>${HTC.esc(new Date(v.created_at.replace(' ', 'T') + 'Z').toLocaleString('vi-VN'))}${i === 0 ? ' <span class="badge badge-success">Mới nhất</span>' : ''}</td>
          <td class="muted">${HTC.esc(v.author || '')}</td>
          <td><button class="btn btn-ghost btn-sm" type="button" data-restore="${v.id}">Khôi phục</button></td></tr>`).join('')
      : '<tr><td class="muted">Chưa có phiên bản nào. Phiên bản được tạo khi bạn xuất bản.</td></tr>';
  }
  $('#history-btn').onclick = async () => { await loadVersions(); history.showModal(); };
  $('#versions').onclick = async (e) => {
    const id = e.target.dataset.restore;
    if (!id || !confirm('Khôi phục phiên bản này vào bản nháp? Thay đổi chưa xuất bản sẽ bị thay thế.')) return;
    try {
      await api(`/pages/${page.id}/versions/${id}/restore`, { method: 'POST', body: {} });
      editor.getModel().set('changesCount', 0);
      location.reload();
    } catch (err) { alert(err.message); }
  };

  const seo = $('#seo-dialog');
  $('#seo-btn').onclick = () => {
    $('#seo-title').value = page.title;
    $('#seo-desc').value = page.meta_description || '';
    $('#seo-og').value = page.og_image || '';
    $('#seo-error').textContent = '';
    seo.showModal();
  };
  $('#seo-cancel').onclick = () => seo.close();
  $('#seo-form').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const body = HTC.formData(e.target);
      await api(`/pages/${page.id}`, { method: 'PATCH', body });
      page.title = body.title;
      page.meta_description = body.metaDescription;
      page.og_image = body.ogImage;
      $('#title').textContent = `${page.site.name} / ${page.title}`;
      seo.close();
    } catch (err) { $('#seo-error').textContent = err.message; }
  };
})();
</script>
</body>
</html>
